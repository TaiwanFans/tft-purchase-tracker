plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.tft.purchase'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tft.purchase'
        minSdk 26
        targetSdk 35
        versionCode 26
        versionName '2.1.3'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        internalDebug {
            storeFile file('tft-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.internalDebug }
        release { signingConfig signingConfigs.internalDebug; minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packagingOptions { jniLibs { useLegacyPackaging = false } }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'com.google.android.gms:play-services-base:18.10.0'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
    implementation files('libs/ppocr-sdk-release.aar')
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.21.1'
    implementation 'com.quickbirdstudios:opencv:4.5.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-ai'
    implementation 'com.google.firebase:firebase-appcheck-debug'
    implementation 'com.google.guava:guava:31.0.1-android'

    testImplementation 'junit:junit:4.13.2'
}
