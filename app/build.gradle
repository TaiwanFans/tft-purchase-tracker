plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jx.smarttranslator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jx.smarttranslator'
        minSdk 28
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/jx/java']
        }
    }
}

dependencies {
}
