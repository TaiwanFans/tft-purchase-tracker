plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tft.purchase'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.tft.purchase'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '2.0.12'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DCMAKE_BUILD_TYPE=Release',
                        '-DBUILD_SHARED_LIBS=ON',
                        '-DLLAMA_BUILD_COMMON=ON',
                        '-DLLAMA_BUILD_TOOLS=ON',
                        '-DLLAMA_BUILD_TESTS=OFF',
                        '-DLLAMA_BUILD_EXAMPLES=OFF',
                        '-DLLAMA_BUILD_SERVER=OFF',
                        '-DLLAMA_OPENSSL=OFF',
                        '-DLLAMA_CURL=OFF',
                        '-DGGML_NATIVE=OFF',
                        '-DGGML_LLAMAFILE=ON',
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    signingConfigs {
        internalDebug {
            storeFile file('tft-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.internalDebug
        }
        release {
            signingConfig signingConfigs.internalDebug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // Bundled Chinese OCR: works offline after APK installation.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.work:work-runtime:2.10.1'
    // Gemma/LiteRT-LM removed: active vision model is MiniCPM-V 4.6 via llama.cpp JNI.
}
