plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tft.purchase'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tft.purchase'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '2.0.3'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Bundle Chinese OCR so recognition works immediately/offline after install.
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    // Persistent background reminder/backup work that survives process death and reboot.
    implementation 'androidx.work:work-runtime:2.10.1'
}
