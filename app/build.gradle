plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tft.purchase'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tft.purchase'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '2.0.4'
    }

    // Stable internal signing key: later APKs can update in place.
    signingConfigs {
        internalDebug {
            storeFile file('tft-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.internalDebug
        }
        release {
            signingConfig signingConfigs.internalDebug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'androidx.work:work-runtime:2.10.1'
}
