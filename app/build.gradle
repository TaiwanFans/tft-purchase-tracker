plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tft.purchase'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tft.purchase'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '2.0.2'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Use the Google Play services delivery of the Chinese OCR model instead of
    // bundling the native OCR runtime inside the APK. This keeps startup safer
    // across newer Pixel / Android memory-page configurations and reduces APK size.
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition-chinese:16.0.1'
}
