plugins {
    id 'com.android.application'
}

android {
    namespace 'com.quanyi.docscanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.quanyi.docscanner'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'org.opencv:opencv:4.10.0'
}
