name: Build Document Scanner APK
on:
  push:
    branches: [ document-scanner-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease
      - name: Collect
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/document-scanner-debug.apk
          cp app/build/outputs/apk/release/app-release.apk deliverables/document-scanner-release.apk
          cp app/build/outputs/bundle/release/app-release.aab deliverables/document-scanner-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: document-scanner-builds
          path: deliverables/*
          if-no-files-found: error
