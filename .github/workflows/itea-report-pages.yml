name: Deploy ITEA Report to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "itea-2026-forum-report/**"
      - ".github/workflows/itea-report-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "itea-report-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload report
        uses: actions/upload-pages-artifact@v3
        with:
          path: itea-2026-forum-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
