name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, accuracy-pipeline-v216 ]
  pull_request:
    branches: [ main, v2-pixel-ux ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Checkout PaddleOCR Android SDK
        run: |
          set -euxo pipefail
          git init paddleocr
          git -C paddleocr remote add origin https://github.com/PaddlePaddle/PaddleOCR.git
          git -C paddleocr fetch --depth 1 origin 2661c7c0ef5c613e8f93c6e93b2e052399f0f854
          git -C paddleocr checkout --detach FETCH_HEAD
          mkdir -p paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/det
          mkdir -p paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/rec
          find paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/java -type f | sort | head -80

      - name: Download PP-OCRv6 Small detection ONNX
        run: |
          set -euxo pipefail
          curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 3 \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_onnx/resolve/28fe5895c24fd108c19eb3e8479f4ab385fbfc62/inference.onnx?download=true" \
            -o paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/det/inference.onnx

      - name: Download PP-OCRv6 Small recognition ONNX
        run: |
          set -euxo pipefail
          curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 3 \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.onnx?download=true" \
            -o paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/rec/inference.onnx

      - name: Download PP-OCRv6 Small recognition config
        run: |
          set -euxo pipefail
          curl --http1.1 -fL --retry 6 --retry-all-errors --retry-delay 3 \
            "https://huggingface.co/PaddlePaddle/PP-OCRv6_small_rec_onnx/resolve/b8f84f0b80c529de40b4fbb3544b84fa7233a513/inference.yml?download=true" \
            -o paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/rec/inference.yml

      - name: Verify PP-OCRv6 Small model SHA-256
        run: |
          echo "d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e  paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/det/inference.onnx" | sha256sum -c -
          echo "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634  paddleocr/deploy/ppocr-android/ppocr-sdk/src/main/assets/models/rec/inference.onnx" | sha256sum -c -

      - name: Build PP-OCRv6 Small Android AAR
        run: |
          set -euxo pipefail
          cd paddleocr/deploy/ppocr-android
          chmod +x gradlew
          ./gradlew :ppocr-sdk:assembleRelease --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp ppocr-sdk/build/outputs/aar/ppocr-sdk-release.aar "$GITHUB_WORKSPACE/app/libs/ppocr-sdk-release.aar"
          test -s "$GITHUB_WORKSPACE/app/libs/ppocr-sdk-release.aar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run golden document regression tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify v2.1.0 APK and SHA-256
        run: |
          set -euxo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          unzip -l app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.contents.txt
          grep -q "models/det/inference.onnx" app/build/outputs/apk/debug/app-debug.contents.txt
          grep -q "models/rec/inference.onnx" app/build/outputs/apk/debug/app-debug.contents.txt
          if grep -Eq "minicpm_v_demo|libllama|libggml|libmtmd" app/build/outputs/apk/debug/app-debug.contents.txt; then
            echo "ERROR: retired local MiniCPM/llama native runtime is still packaged" >&2
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Purchase-Order-Tracker-v2.1.0-Gemini-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.contents.txt
