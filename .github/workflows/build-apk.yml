name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned MiniCPM Android runtime
        run: |
          git init minicpm-v-apps
          git -C minicpm-v-apps remote add origin https://github.com/OpenBMB/MiniCPM-V-Apps.git
          git -C minicpm-v-apps fetch --depth 1 origin bbd042eebd333ab64998d2e630e01d58e673ca3f
          git -C minicpm-v-apps checkout --detach FETCH_HEAD

          git init llama.cpp-omni
          git -C llama.cpp-omni remote add origin https://github.com/tc-mb/llama.cpp-omni.git
          git -C llama.cpp-omni fetch --depth 1 origin bebcf1676fe90db4dd9b4e9764d89e48ed52bdd9
          git -C llama.cpp-omni checkout --detach FETCH_HEAD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TFT-Purchase-Tracker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
