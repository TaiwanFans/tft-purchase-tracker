name: Build LINE AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ line-ai-mvp ]
    paths-ignore:
      - 'releases/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: line-ai-mvp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Publish APK to branch
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/QuanYi-LineAI-MVP.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/QuanYi-LineAI-MVP.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build LINE AI MVP APK [skip ci]"
            git push origin HEAD:line-ai-mvp
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: QuanYi-LineAI-MVP-APK
          path: releases/QuanYi-LineAI-MVP.apk
