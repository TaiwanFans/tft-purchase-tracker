name: Build QuanYi AI Work OS Stable Migration APK

on:
  push:
    branches:
      - quan-yi-ai-work-os-build
    paths:
      - '.ci/quan-yi-ai-work-os/trigger-v0.3.0.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-stable-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct verified v0.3.0 source
        shell: bash
        run: |
          cat .ci/quan-yi-ai-work-os/v03-source.b64.part* > /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64
          base64 --decode /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64 > /tmp/QuanYiAIWorkOS-v0.3.0.zip
          echo '8190f32e5f00648fa4c03ae1e59775321c01d3fb4af38002815d0777a5229e68  /tmp/QuanYiAIWorkOS-v0.3.0.zip' | sha256sum -c -
          rm -rf workos-source
          mkdir -p workos-source
          unzip -q /tmp/QuanYiAIWorkOS-v0.3.0.zip -d workos-source

      - name: Apply Kotlin fix and stable package id
        shell: bash
        run: |
          FILE='workos-source/QuanYiAIWorkOS/app/src/main/java/tw/com/tft/aiworkos/MainActivity.kt'
          sed -i '559,561c\                        .setMessage(if (r.ok) "${secure.providerDisplayName()} / ${secure.modelName}\\n\\n${r.content.take(300)}" else r.error)' "$FILE"
          GRADLE='workos-source/QuanYiAIWorkOS/app/build.gradle.kts'
          sed -i 's/applicationId = "tw.com.tft.aiworkos"/applicationId = "tw.com.tft.aiworkos.stable"/' "$GRADLE"
          STRINGS='workos-source/QuanYiAIWorkOS/app/src/main/res/values/strings.xml'
          sed -i 's#<string name="app_name">全益 AI Work OS</string>#<string name="app_name">全益 AI Work OS 新版</string>#' "$STRINGS"
          grep -q 'applicationId = "tw.com.tft.aiworkos.stable"' "$GRADLE"
          grep -q '全益 AI Work OS 新版' "$STRINGS"

      - name: Gradle configuration check
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle help --stacktrace

      - name: Build unsigned Release APK
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK and signing tools
        shell: bash
        run: |
          APK='workos-source/QuanYiAIWorkOS/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$APK"
          mkdir -p stable-output signing-tools/lib
          cp "$APK" stable-output/QuanYiAIWorkOS-v0.3.0-stable-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/zipalign
          sha256sum stable-output/QuanYiAIWorkOS-v0.3.0-stable-unsigned.apk | tee stable-output/unsigned.sha256
          ls -lh stable-output/* signing-tools/* signing-tools/lib/*

      - name: Upload migration build bundle
        uses: actions/upload-artifact@v4
        with:
          name: QuanYiAIWorkOS-v0.3.0-stable-migration-bundle
          path: |
            stable-output/
            signing-tools/
          if-no-files-found: error
          retention-days: 30
