name: Build QuanYi AI Work OS Agent APK v0.4.0

on:
  push:
    branches:
      - quan-yi-ai-work-os-build
    paths:
      - '.ci/quan-yi-ai-work-os/trigger-v0.4.0.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agent-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct verified v0.3.0 source
        shell: bash
        run: |
          cat .ci/quan-yi-ai-work-os/v03-source.b64.part* > /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64
          base64 --decode /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64 > /tmp/QuanYiAIWorkOS-v0.3.0.zip
          echo '8190f32e5f00648fa4c03ae1e59775321c01d3fb4af38002815d0777a5229e68  /tmp/QuanYiAIWorkOS-v0.3.0.zip' | sha256sum -c -
          rm -rf workos-source
          mkdir -p workos-source
          unzip -q /tmp/QuanYiAIWorkOS-v0.3.0.zip -d workos-source

      - name: Apply verified Kotlin base fix
        shell: bash
        run: |
          FILE='workos-source/QuanYiAIWorkOS/app/src/main/java/tw/com/tft/aiworkos/MainActivity.kt'
          sed -i '559,561c\                        .setMessage(if (r.ok) "${secure.providerDisplayName()} / ${secure.modelName}\\n\\n${r.content.take(300)}" else r.error)' "$FILE"

      - name: Reconstruct and verify v0.4 Agent patch
        shell: bash
        run: |
          cat .ci/quan-yi-ai-work-os/v04line.patch.part00 .ci/quan-yi-ai-work-os/v04line.patch.part01 > /tmp/v04.patch
          base64 --decode .ci/quan-yi-ai-work-os/v04line.patch.part02.b64 >> /tmp/v04.patch
          cat .ci/quan-yi-ai-work-os/v04line.patch.part03 >> /tmp/v04.patch
          echo 'dde34fcfd37b9fe65461dec35e153bd7fd1e44f01d13525b597031442a77d12e  /tmp/v04.patch' | sha256sum -c -
          test "$(wc -c < /tmp/v04.patch)" = '29437'
          cd workos-source/QuanYiAIWorkOS
          patch -p1 < /tmp/v04.patch
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q 'AgentSyncManager' app/src/main/java/tw/com/tft/aiworkos/LineNotificationListenerService.kt
          test -f app/src/main/java/tw/com/tft/aiworkos/AgentSyncManager.kt

      - name: Set permanent Agent package id
        shell: bash
        run: |
          GRADLE='workos-source/QuanYiAIWorkOS/app/build.gradle.kts'
          STRINGS='workos-source/QuanYiAIWorkOS/app/src/main/res/values/strings.xml'
          sed -i 's/applicationId = "tw.com.tft.aiworkos.stable"/applicationId = "tw.com.tft.aiworkos.agent"/' "$GRADLE"
          sed -i 's#<string name="app_name">全益 AI Work OS</string>#<string name="app_name">全益 AI Work OS Agent</string>#' "$STRINGS"
          grep -q 'applicationId = "tw.com.tft.aiworkos.agent"' "$GRADLE"

      - name: Gradle configuration check
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle help --stacktrace

      - name: Build unsigned Release APK
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle :app:assembleRelease --stacktrace

      - name: Collect APK and signing tools
        shell: bash
        run: |
          APK='workos-source/QuanYiAIWorkOS/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$APK"
          mkdir -p agent-output signing-tools/lib
          cp "$APK" agent-output/QuanYiAIWorkOS-v0.4.0-agent-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/apksigner
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing-tools/zipalign
          sha256sum agent-output/QuanYiAIWorkOS-v0.4.0-agent-unsigned.apk | tee agent-output/unsigned.sha256

      - name: Upload Agent build bundle
        uses: actions/upload-artifact@v4
        with:
          name: QuanYiAIWorkOS-v0.4.0-agent-bundle
          path: |
            agent-output/
            signing-tools/
          if-no-files-found: error
          retention-days: 30
