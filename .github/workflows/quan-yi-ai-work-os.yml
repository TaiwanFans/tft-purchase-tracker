name: Build QuanYi AI Work OS Agent APK v0.4.0

on:
  push:
    branches:
      - quan-yi-ai-work-os-build
    paths:
      - '.ci/quan-yi-ai-work-os/trigger-v0.4.0.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agent-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct verified v0.3.0 source
        shell: bash
        run: |
          cat .ci/quan-yi-ai-work-os/v03-source.b64.part* > /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64
          base64 --decode /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64 > /tmp/QuanYiAIWorkOS-v0.3.0.zip
          echo '8190f32e5f00648fa4c03ae1e59775321c01d3fb4af38002815d0777a5229e68  /tmp/QuanYiAIWorkOS-v0.3.0.zip' | sha256sum -c -
          rm -rf workos-source
          mkdir -p workos-source
          unzip -q /tmp/QuanYiAIWorkOS-v0.3.0.zip -d workos-source

      - name: Apply verified Kotlin base fix
        shell: bash
        run: |
          FILE='workos-source/QuanYiAIWorkOS/app/src/main/java/tw/com/tft/aiworkos/MainActivity.kt'
          sed -i '559,561c\                        .setMessage(if (r.ok) "${secure.providerDisplayName()} / ${secure.modelName}\\n\\n${r.content.take(300)}" else r.error)' "$FILE"

      - name: Diagnose v0.4 patch transfer
        shell: bash
        run: |
          for f in .ci/quan-yi-ai-work-os/v04line.patch.part*; do
            echo "FILE=$f BYTES=$(wc -c < "$f")"
            sha256sum "$f"
          done
          cat .ci/quan-yi-ai-work-os/v04line.patch.part* > /tmp/v04.patch
          echo "CONCAT_BYTES=$(wc -c < /tmp/v04.patch)"
          sha256sum /tmp/v04.patch
          echo 'EXPECTED:'
          echo 'part00 6556 14ffaed7d8494365911ea7dfdc316b405aba2854a6d7d565b9fa4119e005640a'
          echo 'part01 9012 b0fb7d4e61890641a325c38c52881a2399ccdbfbf944164b1fb7939e9bdcbe0f'
          echo 'part02 7305 3d769d39609454ee99541b551e10a8ba1f202c064f6a9b21932652378b39b94a'
          echo 'part03 6564 ac0ec5137dbbcad901d231b77344f7db3b4dfc89b2ff540aaca6d3d8e247d912'
          echo 'concat 29437 dde34fcfd37b9fe65461dec35e153bd7fd1e44f01d13525b597031442a77d12e'
          exit 1
