name: Build QuanYi AI Work OS APK v0.3.0

on:
  push:
    branches:
      - quan-yi-ai-work-os-build
    paths:
      - '.ci/quan-yi-ai-work-os/trigger-v0.3.0.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct verified v0.3.0 source
        shell: bash
        run: |
          cat .ci/quan-yi-ai-work-os/v03-source.b64.part* > /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64
          base64 --decode /tmp/QuanYiAIWorkOS-v0.3.0.zip.b64 > /tmp/QuanYiAIWorkOS-v0.3.0.zip
          echo '8190f32e5f00648fa4c03ae1e59775321c01d3fb4af38002815d0777a5229e68  /tmp/QuanYiAIWorkOS-v0.3.0.zip' | sha256sum -c -
          rm -rf workos-source
          mkdir -p workos-source
          unzip -q /tmp/QuanYiAIWorkOS-v0.3.0.zip -d workos-source
          test -f workos-source/QuanYiAIWorkOS/settings.gradle.kts
          test -f workos-source/QuanYiAIWorkOS/app/build.gradle.kts
          grep -q 'versionName = "0.3.0"' workos-source/QuanYiAIWorkOS/app/build.gradle.kts
          grep -q 'getConversationBundles' workos-source/QuanYiAIWorkOS/app/src/main/java/tw/com/tft/aiworkos/WorkOSDatabase.kt
          grep -q 'analyzeConversation' workos-source/QuanYiAIWorkOS/app/src/main/java/tw/com/tft/aiworkos/AIClient.kt

      - name: Apply verified Kotlin syntax fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('workos-source/QuanYiAIWorkOS/app/src/main/java/tw/com/tft/aiworkos/MainActivity.kt')
          s = p.read_text()
          old = '''.setMessage(if (r.ok) "${secure.providerDisplayName()} / ${secure.modelName}

${r.content.take(300)}" else r.error)'''
          new = '''.setMessage(if (r.ok) "${secure.providerDisplayName()} / ${secure.modelName}\\n\\n${r.content.take(300)}" else r.error)'''
          if old not in s:
              raise SystemExit('Expected malformed AI connection message was not found')
          p.write_text(s.replace(old, new, 1))
          print('MainActivity.kt syntax fix applied')
          PY

      - name: Gradle configuration check
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle help --stacktrace

      - name: Build Debug APK
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK='workos-source/QuanYiAIWorkOS/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanYiAIWorkOS-v0.3.0-debug-apk
          path: |
            workos-source/QuanYiAIWorkOS/app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 30
