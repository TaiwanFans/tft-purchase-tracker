name: Build QuanYi AI Work OS APK v0.2.0

on:
  push:
    branches:
      - quan-yi-ai-work-os-build
    paths:
      - '.ci/quan-yi-ai-work-os/trigger-v0.2.0.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct Android source archive v0.2.0
        shell: bash
        run: |
          cat .ci/quan-yi-ai-work-os/source.b64.part* > /tmp/QuanYiAIWorkOS-source-v0.2.0.zip.b64
          base64 --decode /tmp/QuanYiAIWorkOS-source-v0.2.0.zip.b64 > /tmp/QuanYiAIWorkOS-source-v0.2.0.zip
          echo '517389eb3c1630bd2c003f39782d7172daac00a42d5cbe0633dbdeddb1d985eb  /tmp/QuanYiAIWorkOS-source-v0.2.0.zip' | sha256sum -c -
          rm -rf workos-source
          mkdir -p workos-source
          unzip -q /tmp/QuanYiAIWorkOS-source-v0.2.0.zip -d workos-source
          test -f workos-source/QuanYiAIWorkOS/settings.gradle.kts
          test -f workos-source/QuanYiAIWorkOS/app/build.gradle.kts

      - name: Gradle configuration check
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle help --stacktrace

      - name: Build Debug APK
        working-directory: workos-source/QuanYiAIWorkOS
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK='workos-source/QuanYiAIWorkOS/app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK" | tee app-debug.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuanYiAIWorkOS-v0.2.0-debug-apk
          path: |
            workos-source/QuanYiAIWorkOS/app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
          retention-days: 30
