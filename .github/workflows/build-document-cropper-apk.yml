name: Build Document Cropper APK

on:
  push:
    branches:
      - document-cropper-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout clean v2 source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: V2 clean-source architecture review
        working-directory: android-document-cropper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          build = Path('app/build.gradle').read_text(encoding='utf-8')
          main = Path('app/src/main/java/com/quanyi/docscanner/MainActivity.java').read_text(encoding='utf-8')
          image = Path('app/src/main/java/com/quanyi/docscanner/ImageUtils.java').read_text(encoding='utf-8')
          classes = Path('app/src/main/java/com/quanyi/docscanner')
          required = [
              'ScanSession.java', 'DeviceProfile.java', 'DocumentDetector.java',
              'CropController.java', 'FilterPreset.java', 'DocumentFilterEngine.java',
              'PreviewRenderer.java', 'ExportManager.java', 'DocumentCropView.java',
              'ZoomableImageView.java'
          ]
          for name in required:
              assert (classes / name).exists(), name
          assert not list(root.glob('patch_v*.py')), 'legacy patch chain still present'
          assert not (root / 'migrate_v2_core.py').exists(), 'migration script must be retired'
          assert "versionName '2.0.0'" in build and 'versionCode 200' in build
          assert 'private final ScanSession session = new ScanSession();' in main
          assert 'session.saveToBundle(outState)' in main
          assert 'session.restoreFromBundle(b)' in main
          assert 'previewRenderer.render(' in main
          assert 'exportManager.renderFinal(' in main
          assert 'filterEngine.apply(base, preset)' in main
          assert 'ImageUtils.enhance(base' not in main
          assert 'presetBright()' not in main and 'presetSharp()' not in main and 'presetMonochrome()' not in main
          assert 'MORPH_BLACKHAT' in image and 'normalizeIllumination' in image
          assert 'nearFramePenalty' in image
          crop = (classes / 'DocumentCropView.java').read_text(encoding='utf-8')
          assert 'buildSnapEdgeMap' in crop and 'snapEdgeToDocument' in crop
          assert 'handleSize = dp(10)' in crop and 'float best=dp(110)' in crop
          export = (classes / 'ExportManager.java').read_text(encoding='utf-8')
          assert 'loadBitmapExact' in export and 'perspectiveCrop' in export
          assert 'Bitmap.CompressFormat.JPEG' in export
          preview = (classes / 'PreviewRenderer.java').read_text(encoding='utf-8')
          assert 'loadBitmapExact' in preview and 'perspectiveCrop' in preview
          print('V2 clean-source architecture review OK')
          PY

      - name: Run unit tests
        working-directory: android-document-cropper
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile debug APK
        working-directory: android-document-cropper
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK and manifest
        working-directory: android-document-cropper
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          apkanalyzer manifest application-id app/build/outputs/apk/debug/app-debug.apk | grep -q '^com.quanyi.docscanner$'
          apkanalyzer manifest version-name app/build/outputs/apk/debug/app-debug.apk | grep -q '^2.0.0$'
          echo "V2 APK archive + manifest validation OK"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Emulator startup smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_4
          disable-animations: true
          disk-size: 4096M
          script: |
            adb logcat -c
            adb install -r android-document-cropper/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.quanyi.docscanner || true
            adb shell am start -W -n com.quanyi.docscanner/.MainActivity | tee /tmp/app-start.txt
            grep -q 'Status: ok' /tmp/app-start.txt
            sleep 5
            PID=$(adb shell pidof com.quanyi.docscanner | tr -d '\r')
            test -n "$PID"
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.quanyi.docscanner'
            adb exec-out screencap -p > /tmp/v2-home.png
            test -s /tmp/v2-home.png
            if adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION|Process: com\.quanyi\.docscanner.*PID|AndroidRuntime.*FATAL'; then
              echo 'Crash detected during startup smoke test'
              exit 1
            fi
            echo "V2 emulator startup smoke test OK; PID=$PID"

      - name: Upload smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-cropper-v2-smoke-screenshot
          path: /tmp/v2-home.png
          if-no-files-found: ignore

      - name: Upload final v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: document-cropper-apk-v2-core-final
          path: android-document-cropper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload clean v2 source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: document-cropper-source-v2-core-final
          path: |
            android-document-cropper/.gitignore
            android-document-cropper/app/src
            android-document-cropper/app/build.gradle
            android-document-cropper/build.gradle
            android-document-cropper/gradle.properties
            android-document-cropper/settings.gradle
          if-no-files-found: error
