name: Build Document Cropper APK

on:
  push:
    branches:
      - document-cropper-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v1.5.8 release patches
        working-directory: android-document-cropper
        run: |
          sed -i "s/^guide box')/'guide box')/" patch_v140.py
          python3 patch_v140.py
          python3 patch_v151.py
          python3 patch_v152.py
          python3 patch_v152_fix.py
          python3 patch_v153.py
          python3 patch_v154.py
          python3 patch_v155.py
          python3 patch_v155_fix.py
          python3 patch_v156.py
          python3 patch_v157.py
          python3 patch_v158.py
          python3 patch_v158_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          build = Path('app/build.gradle').read_text(encoding='utf-8')
          main = Path('app/src/main/java/com/quanyi/docscanner/MainActivity.java').read_text(encoding='utf-8')
          crop = Path('app/src/main/java/com/quanyi/docscanner/DocumentCropView.java').read_text(encoding='utf-8')
          image = Path('app/src/main/java/com/quanyi/docscanner/ImageUtils.java').read_text(encoding='utf-8')
          zoom = Path('app/src/main/java/com/quanyi/docscanner/ZoomableImageView.java').read_text(encoding='utf-8')
          assert "versionName '1.5.8'" in build and 'versionCode 158' in build
          assert 'prepareAiBatchForPreview' in main
          assert 'buildPreviewDocumentBitmap' in main and 'previewQualityMaxDimension' in main
          assert 'buildFinalDocumentBitmap' in main
          assert '按住對比｜查看原圖' in main and 'compareOriginalBitmap' in main
          assert '增強銳化' in main
          assert 'setImageBitmapKeepTransform' in zoom
          assert 'normalizeIllumination' in image
          assert 'MORPH_BLACKHAT' in image
          assert 'unsharpLuminance' in image
          assert 'enhanceStrongSharpOpenCv' in image
          assert 'adaptiveThreshold(temp, processed' in image
          assert 'handleSize = dp(10)' in crop and 'float best=dp(110)' in crop
          assert 'buildSnapEdgeMap' in crop and 'snapEdgeToDocument' in crop
          assert 'loadBitmapExact' in main and 'outputMaxDimension()' in main
          assert 'ImageUtils.perspectiveCrop(original, points, outputMaxDimension())' in main
          assert 'nearFramePenalty' in image
          assert 'perspectiveCrop(Bitmap src, PointF[] p, int maxOutputDim)' in image
          ET.parse('app/src/main/res/drawable/ic_pixel_document.xml')
          print('v1.5.8 source self-review OK')
          PY

      - name: Upload flattened source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: document-cropper-source-v158-flattened
          path: |
            android-document-cropper/app
            android-document-cropper/build.gradle
            android-document-cropper/gradle.properties
            android-document-cropper/settings.gradle
          if-no-files-found: error

      - name: Compile and build debug APK
        working-directory: android-document-cropper
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK archive
        working-directory: android-document-cropper
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "APK archive validation OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: document-cropper-apk-v158
          path: android-document-cropper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
