name: Build Document Cropper APK

on:
  push:
    branches:
      - document-cropper-apk-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v1.5.6 release patches
        working-directory: android-document-cropper
        run: |
          sed -i "s/^guide box')/'guide box')/" patch_v140.py
          python3 patch_v140.py
          python3 patch_v151.py
          python3 patch_v152.py
          python3 patch_v152_fix.py
          python3 patch_v153.py
          python3 patch_v154.py
          python3 patch_v155.py
          python3 patch_v155_fix.py
          python3 patch_v156.py
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          build = Path('app/build.gradle').read_text(encoding='utf-8')
          main = Path('app/src/main/java/com/quanyi/docscanner/MainActivity.java').read_text(encoding='utf-8')
          crop = Path('app/src/main/java/com/quanyi/docscanner/DocumentCropView.java').read_text(encoding='utf-8')
          image = Path('app/src/main/java/com/quanyi/docscanner/ImageUtils.java').read_text(encoding='utf-8')
          assert "versionName '1.5.6'" in build
          assert 'versionCode 156' in build
          assert 'cropSideInsetPx' in crop and '0.090f' in crop and 'dp(110)' in crop
          assert 'loadBitmapExact' in main and 'outputMaxDimension()' in main
          assert '文字銳利' in main and '自然灰階' in main and '灰階清晰' in main
          assert 'best.score < 70.0' in image and 'nearFramePenalty' in image
          assert 'perspectiveCrop(Bitmap src, PointF[] p, int maxOutputDim)' in image
          assert 'adaptiveThreshold(temp, processed' in image
          ET.parse('app/src/main/res/drawable/ic_pixel_document.xml')
          print('v1.5.6 source verification OK')
          PY

      - name: Compile and build debug APK
        working-directory: android-document-cropper
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate APK archive
        working-directory: android-document-cropper
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "APK archive validation OK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: document-cropper-apk-v156
          path: android-document-cropper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
