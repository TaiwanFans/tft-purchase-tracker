name: Build StorySpeaker APK
on:
  push:
    branches: [ "apk-build" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: StorySpeakerAndroid
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp StorySpeakerAndroid/app/build/outputs/apk/debug/app-debug.apk StorySpeaker-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StorySpeaker-APK
          path: StorySpeaker-v1.0.apk
