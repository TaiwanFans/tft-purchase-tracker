name: Build Who Is Undercover Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - undercover-offline-apk

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build carrier branch
        uses: actions/checkout@v4

      - name: Reconstruct Android source package
        shell: bash
        run: |
          cat source-chunks/source.b64.* > undercover-source.b64
          base64 --decode undercover-source.b64 > undercover-source.zip
          echo "Source archive checksum:"
          sha256sum undercover-source.zip
          rm -rf app build.gradle settings.gradle gradle.properties README.md
          unzip -o undercover-source.zip
          test -f app/src/main/java/com/joshua/undercover/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --version

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed debug APK
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and prepare delivery file
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | head -20
          cp "$APK" "WhoIsUndercover-Offline-1.0.0.apk"
          sha256sum "WhoIsUndercover-Offline-1.0.0.apk" > "WhoIsUndercover-Offline-1.0.0.apk.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: WhoIsUndercover-Offline-APK
          path: |
            WhoIsUndercover-Offline-1.0.0.apk
            WhoIsUndercover-Offline-1.0.0.apk.sha256
          if-no-files-found: error
          retention-days: 30
