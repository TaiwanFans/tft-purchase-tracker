name: Android startup smoke test

on:
  push:
    branches: [v2-pixel-ux]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Launch app on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.tft.purchase/.GemmaSetupActivity
            sleep 5
            echo '--- PROCESS ---'
            adb shell pidof com.tft.purchase || true
            echo '--- CRASH LOG ---'
            adb logcat -d -v threadtime | grep -E 'FATAL EXCEPTION|AndroidRuntime|com.tft.purchase|Process: com.tft.purchase' | tail -n 250
            test -n "$(adb shell pidof com.tft.purchase)"
