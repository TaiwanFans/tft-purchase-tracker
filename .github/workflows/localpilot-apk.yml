name: Build LocalPilot APK

on:
  workflow_dispatch:
  push:
    branches: [ localpilot-ci ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract LocalPilot source
        run: |
          mkdir -p LocalPilot
          unzip -q LocalPilot-v0.3-ci-source.zip -d LocalPilot

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: LocalPilot
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalPilot-v0.3-debug-apk
          path: LocalPilot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
