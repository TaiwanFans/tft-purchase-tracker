name: Build LINE AI Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore v0.3 Android project
        run: |
          cat line-ai-build/v03/source.part00 line-ai-build/v03/source.part01 line-ai-build/v03/source.part02 line-ai-build/v03/source.part03 line-ai-build/v03/source.part04 line-ai-build/v03/source.part05 line-ai-build/v03/source.part06 > line-ai-build/v03/source.b64
          base64 --decode line-ai-build/v03/source.b64 > line-ai-build/v03/source.tar.xz
          echo '67cd6f9e3a69eb78972bd1a77b10924dd985ca07beaacaaddcf6c11a7b554987  line-ai-build/v03/source.tar.xz' | sha256sum -c -
          tar -xJf line-ai-build/v03/source.tar.xz
          test -f quanyi_v03/settings.gradle.kts
          test -f quanyi_v03/app/build.gradle.kts
          grep -q 'versionName = "0.3.0"' quanyi_v03/app/build.gradle.kts

      - name: Build v0.3 debug APK
        working-directory: quanyi_v03
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload v0.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: Quanyi-LINE-AI-Work-Control-v0.3-APK
          path: quanyi_v03/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
