name: Build LINEOUT v1.0 AI Operations Hub

on:
  workflow_dispatch:
  push:
    branches:
      - temp-line-ai-apk-build-v1-finalize
    paths:
      - 'line-ai-build/v10patch/**'
      - '.github/workflows/build-line-ai-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct verified v0.5 source
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05 06 07 08; do test "$(wc -c < line-ai-build/v05chunks/source.part$i)" -eq 6000; done
          test "$(wc -c < line-ai-build/v05chunks/source.part09)" -eq 2288
          cat line-ai-build/v05chunks/source.part{00,01,02,03,04,05,06,07,08,09} > /tmp/v05-source.b64
          echo '7c878db5ce0f41b7fa7f9bfe193e438b93ad267ffc021fbbf9cc1d504ee05f0e  /tmp/v05-source.b64' | sha256sum -c -
          base64 --decode /tmp/v05-source.b64 > /tmp/v05-source.tar.xz
          echo '2b82f1c4dbec48f3cbd6c203691d5c5be5d067550d829ebc1c4afb7be391b48a  /tmp/v05-source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v05-source.tar.xz

      - name: Reconstruct verified v0.6 source
        run: |
          set -euo pipefail
          cat line-ai-build/v06patch/patch.part{00,01,02,03,04} > /tmp/v06-patch.b64
          echo 'e1b3f8cfba0aa3acdb31fe6b6d2ed3959a6ccd9a7044f5341107c45b954459f1  /tmp/v06-patch.b64' | sha256sum -c -
          base64 --decode /tmp/v06-patch.b64 > /tmp/v06-patch.xz
          echo '674d69ab87169ba81c3a38f5972a007bc1df5299d3f23ca137572727afdcccf2  /tmp/v06-patch.xz' | sha256sum -c -
          xz -dc /tmp/v06-patch.xz > /tmp/v06.patch
          echo '657f890e9d20edf149d11da05c05b8db06be7b328c1073f1c03bdc124b0b04dd  /tmp/v06.patch' | sha256sum -c -
          sed -e 's#v06src/v04work#v04work#g' -e 's#v06work#v04work#g' /tmp/v06.patch > /tmp/v06-apply.patch
          patch --dry-run -p0 < /tmp/v06-apply.patch
          patch -p0 < /tmp/v06-apply.patch
          echo 'b32d4a2bcc133fdc850f1ca354cebe8b40d3a8b67edfa80875ed8fdc93539d51  line-ai-build/v06fix/compile-fix.patch' | sha256sum -c -
          patch --dry-run -p0 < line-ai-build/v06fix/compile-fix.patch
          patch -p0 < line-ai-build/v06fix/compile-fix.patch
          grep -q 'versionCode = 7' v04work/app/build.gradle.kts
          grep -q 'version = 4' v04work/app/src/main/java/tw/com/tft/lineai/data/AppDatabase.kt

      - name: Verify and apply LINEOUT v1.0 patch
        run: |
          set -euo pipefail
          expected_sizes=(6000 6000 6000 6000 6000 6000 6000 6000 6000 3168)
          expected_hashes=(
            7048e244f6f901b4844f44607979564bdae6ac02af622b39e91cad3d65fd42b0
            0b2c17f6ac313b3d3b15e1d29c7a9b706724a3c2b7a7fbf0b5a49d7c0ade352e
            826066c825823562a4053da67ed193e41600b5e0d91b425e9712f6de7a38a562
            0cce0d3942d14b48a2ca2ac8df4abdc487059f0afa59555128279e2a835e7a07
            c5b02d410efd5e38c6b61863a6eda78fc97ff860904fdd2ca7648cb6c18e202a
            3e12dc421cb402b0974a84240b231b39b78d4787e4f6baaa9eaa920ba5c97aaa
            6af54b6a0362e7255cb928ba7d68dca5fe24a05bee8d20554d36a987ab2120d8
            bdc1e13f1e95f96416264f2462edd1369bb6fd9c239d84abf143e9e03a83872c
            5707df5d5134d22246c2a8bd527b6e6674e620275852d78b25a8482d55c3cd91
            b8dca01cd55abb9206ae6349e02508448764e21be46c3cced1bed74f27de2071
          )
          for n in $(seq 0 9); do
            i=$(printf '%02d' "$n")
            f="line-ai-build/v10patch/patch.part$i"
            test "$(wc -c < "$f")" -eq "${expected_sizes[$n]}"
            echo "${expected_hashes[$n]}  $f" | sha256sum -c -
          done
          cat line-ai-build/v10patch/patch.part{00,01,02,03,04,05,06,07,08,09} > /tmp/v10-patch.b64
          echo '202a5bd22ed0aedaaf501d5e9db9e2320c66d58010ceba65151882994ed33278  /tmp/v10-patch.b64' | sha256sum -c -
          base64 --decode /tmp/v10-patch.b64 > /tmp/v10-patch.xz
          echo '71632e2ec1f8340a243834f08c5ac236cb9d3bcac90185f276b47aec380ae2dd  /tmp/v10-patch.xz' | sha256sum -c -
          xz -dc /tmp/v10-patch.xz > /tmp/v10.patch
          echo '675256e8d8d17d95b8b94a55f90846df007371e14791527675cb3e45121cd2e8  /tmp/v10.patch' | sha256sum -c -
          sed -e 's#lineout_v06_clean#v04work#g' -e 's#lineout_v10_src#v04work#g' /tmp/v10.patch > /tmp/v10-apply.patch
          patch --dry-run -p0 < /tmp/v10-apply.patch
          patch -p0 < /tmp/v10-apply.patch
          grep -q 'versionCode = 8' v04work/app/build.gradle.kts
          grep -q 'versionName = "1.0.0"' v04work/app/build.gradle.kts
          grep -q 'version = 5' v04work/app/src/main/java/tw/com/tft/lineai/data/AppDatabase.kt
          grep -q 'BACKUP_SCHEMA = 4' v04work/app/src/main/java/tw/com/tft/lineai/backup/BackupManager.kt
          test -f v04work/app/src/main/java/tw/com/tft/lineai/data/V1Models.kt
          test -f v04work/app/src/main/java/tw/com/tft/lineai/domain/V1OperationalEngine.kt
          test -f v04work/app/src/main/java/tw/com/tft/lineai/ai/AIProvider.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build unsigned LINEOUT v1.0 release APK
        working-directory: v04work
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify v1.0 package identity and unsigned state
        run: |
          set -euo pipefail
          APK=v04work/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/v10-badging.txt
          grep -q "package: name='tw.com.tft.lineai' versionCode='8' versionName='1.0.0'" /tmp/v10-badging.txt
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"; then
            echo 'Unsigned v1.0 release unexpectedly verifies as signed'; exit 1
          fi
          sha256sum "$APK"

      - name: Prepare offline signing tool
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner

      - name: Upload unsigned LINEOUT v1.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: LINEOUT-v1.0-Unsigned-Release
          path: v04work/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-36-LINEOUT-v1.0
          path: signing-tools
          if-no-files-found: error
          retention-days: 7
