name: Export verified v0.5 source

on:
  workflow_dispatch:
  push:
    branches:
      - temp-line-ai-apk-build
    paths:
      - '.github/workflows/build-line-ai-apk.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify v0.5 source
        run: |
          test "$(wc -c < line-ai-build/v05chunks/source.part00)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part01)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part02)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part03)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part04)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part05)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part06)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part07)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part08)" -eq 6000
          test "$(wc -c < line-ai-build/v05chunks/source.part09)" -eq 2288
          cat line-ai-build/v05chunks/source.part00 line-ai-build/v05chunks/source.part01 line-ai-build/v05chunks/source.part02 line-ai-build/v05chunks/source.part03 line-ai-build/v05chunks/source.part04 line-ai-build/v05chunks/source.part05 line-ai-build/v05chunks/source.part06 line-ai-build/v05chunks/source.part07 line-ai-build/v05chunks/source.part08 line-ai-build/v05chunks/source.part09 > line-ai-build/v05chunks/source.b64
          echo '7c878db5ce0f41b7fa7f9bfe193e438b93ad267ffc021fbbf9cc1d504ee05f0e  line-ai-build/v05chunks/source.b64' | sha256sum -c -
          base64 --decode line-ai-build/v05chunks/source.b64 > line-ai-build/v05chunks/source.tar.xz
          echo '2b82f1c4dbec48f3cbd6c203691d5c5be5d067550d829ebc1c4afb7be391b48a  line-ai-build/v05chunks/source.tar.xz' | sha256sum -c -
          tar -xJf line-ai-build/v05chunks/source.tar.xz
          grep -q 'versionCode = 5' v04work/app/build.gradle.kts
          grep -q 'version = 3' v04work/app/src/main/java/tw/com/tft/lineai/data/AppDatabase.kt
          zip -qr /tmp/quanyi-v05-verified-source.zip v04work
          sha256sum /tmp/quanyi-v05-verified-source.zip

      - name: Upload verified v0.5 source
        uses: actions/upload-artifact@v4
        with:
          name: Quanyi-LINEOUT-v0.5-Verified-Source
          path: /tmp/quanyi-v05-verified-source.zip
          if-no-files-found: error
          retention-days: 7
