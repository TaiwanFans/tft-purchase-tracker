name: Build LINE AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - temp-line-ai-apk-build
    paths:
      - 'line-ai-build/**'
      - '.github/workflows/build-line-ai-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore and adapt Android project
        run: |
          cat line-ai-build/source.part00 line-ai-build/source.part01 line-ai-build/source.part02 line-ai-build/source.part03 > line-ai-build/source.b64
          base64 --decode line-ai-build/source.b64 > line-ai-build/source.tar.xz
          tar -xJf line-ai-build/source.tar.xz
          test -f quanyi_line_ai_android/settings.gradle.kts
          test -f quanyi_line_ai_android/app/build.gradle.kts
          patch -p0 < line-ai-build/fix-mlkit.patch
          sed -i 's/compileSdk = 37/compileSdk = 36/' quanyi_line_ai_android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' quanyi_line_ai_android/app/build.gradle.kts
          sed -i 's/compose-bom:2026.08.00/compose-bom:2026.04.01/' quanyi_line_ai_android/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.11.0/' quanyi_line_ai_android/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.10.0/' quanyi_line_ai_android/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-compose:2.11.0/lifecycle-runtime-compose:2.10.0/' quanyi_line_ai_android/app/build.gradle.kts

      - name: Build debug APK
        working-directory: quanyi_line_ai_android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Quanyi-LINE-AI-Pixel10ProXL-APK
          path: quanyi_line_ai_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
