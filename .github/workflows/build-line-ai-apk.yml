name: Build LINE AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - temp-line-ai-apk-build
    paths:
      - 'line-ai-build/**'
      - '.github/workflows/build-line-ai-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Restore v0.2 Android project
        run: |
          cat line-ai-build/v02/source.part00 line-ai-build/v02/source.part01 line-ai-build/v02/source.part02 line-ai-build/v02/source.part03 line-ai-build/v02/source.part04 > line-ai-build/v02/source.b64
          base64 --decode line-ai-build/v02/source.b64 > line-ai-build/v02/source.tar.xz
          tar -xJf line-ai-build/v02/source.tar.xz
          test -f quanyi_v02/settings.gradle.kts
          test -f quanyi_v02/app/build.gradle.kts
          grep -q 'versionName = "0.2.0"' quanyi_v02/app/build.gradle.kts

      - name: Build v0.2 debug APK
        working-directory: quanyi_v02
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload v0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Quanyi-LINE-AI-Group-Control-v0.2-APK
          path: quanyi_v02/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
