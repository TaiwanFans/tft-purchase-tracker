name: Build LINE AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - temp-line-ai-apk-build
    paths:
      - 'line-ai-build/v04safe/**'
      - '.github/workflows/build-line-ai-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Diagnose source chunk integrity
        run: |
          wc -c line-ai-build/v04safe/source.part*
          sha256sum line-ai-build/v04safe/source.part*
          cat line-ai-build/v04safe/source.part00 line-ai-build/v04safe/source.part01 line-ai-build/v04safe/source.part02 line-ai-build/v04safe/source.part03 line-ai-build/v04safe/source.part04 line-ai-build/v04safe/source.part05 line-ai-build/v04safe/source.part06 line-ai-build/v04safe/source.part07 > line-ai-build/v04safe/source.b64
          sha256sum line-ai-build/v04safe/source.b64

      - name: Verify v0.4 source package
        run: |
          echo '690b14e9ddd75b05c9c952175af14b323070106432666edbe9500e3ee14e20a5  line-ai-build/v04safe/source.b64' | sha256sum -c -
          base64 --decode line-ai-build/v04safe/source.b64 > line-ai-build/v04safe/source.tar.xz
          echo 'c37a4808f302f9dcacf58c45ee1c9fdb34d469baf858e3ceb0ce0424a32b0a37  line-ai-build/v04safe/source.tar.xz' | sha256sum -c -
          tar -xJf line-ai-build/v04safe/source.tar.xz
          test -f v04work/settings.gradle.kts
          test -f v04work/app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' v04work/app/build.gradle.kts
          grep -q 'android:allowBackup="true"' v04work/app/src/main/AndroidManifest.xml
          test -f v04work/app/src/main/java/tw/com/tft/lineai/backup/BackupManager.kt

      - name: Set up JDK 17
        if: success()
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: success()
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        if: success()
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        if: success()
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build v0.4 debug APK
        if: success()
        working-directory: v04work
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload v0.4 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Quanyi-LINE-AI-Work-Control-v0.4-Backup-APK
          path: v04work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
