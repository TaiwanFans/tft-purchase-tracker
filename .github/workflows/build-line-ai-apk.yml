name: Build LINE AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - temp-line-ai-apk-build
    paths:
      - 'line-ai-build/v05/**'
      - '.github/workflows/build-line-ai-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Verify and restore v0.5 source package
        run: |
          echo '3494a6ca0973fc4132801515c0ab27e35241440c12f7acd9e50994660e807bce  line-ai-build/v05/source.tar.xz' | sha256sum -c -
          tar -xJf line-ai-build/v05/source.tar.xz
          test -f v04work/settings.gradle.kts
          test -f v04work/app/build.gradle.kts
          grep -q 'versionCode = 5' v04work/app/build.gradle.kts
          grep -q 'versionName = "0.5.0"' v04work/app/build.gradle.kts
          grep -q 'version = 3' v04work/app/src/main/java/tw/com/tft/lineai/data/AppDatabase.kt
          test -f v04work/app/src/main/java/tw/com/tft/lineai/backup/BackupManager.kt
          test -f v04work/app/src/main/java/tw/com/tft/lineai/domain/IdentityManager.kt
          test -f v04work/app/src/main/java/tw/com/tft/lineai/domain/ReviewManager.kt
          grep -q 'BACKUP_SCHEMA = 2' v04work/app/src/main/java/tw/com/tft/lineai/backup/BackupManager.kt

          # Normalize a deprecation annotation into a compiler-safe form before the first release build.
          sed -i 's/private fun signingCertificateSha256/@Suppress("DEPRECATION")\\nprivate fun signingCertificateSha256/' v04work/app/src/main/java/tw/com/tft/lineai/MainActivity.kt
          sed -i 's/else @Suppress("DEPRECATION") PackageManager.GET_SIGNATURES/else PackageManager.GET_SIGNATURES/' v04work/app/src/main/java/tw/com/tft/lineai/MainActivity.kt
          sed -i 's/@Suppress("DEPRECATION") info.signatures/info.signatures/' v04work/app/src/main/java/tw/com/tft/lineai/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Compile and assemble unsigned v0.5 release APK
        working-directory: v04work
        run: |
          gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Verify package identity and version
        run: |
          APK=v04work/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/v05-badging.txt
          grep -q "package: name='tw.com.tft.lineai' versionCode='5' versionName='0.5.0'" /tmp/v05-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" && { echo 'Unsigned release unexpectedly verifies as signed'; exit 1; } || true
          sha256sum "$APK"

      - name: Prepare offline signing tool
        run: |
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner

      - name: Upload v0.5 unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: Quanyi-LINE-AI-v0.5-Unsigned-Release
          path: v04work/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-36
          path: signing-tools
          if-no-files-found: error
          retention-days: 7
